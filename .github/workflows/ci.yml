name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest pytest-cov

      - name: Install package and service requirements
        # Each packages/<name>/ and services/<name>/ may declare its own deps.
        # Without this, pytest fails at COLLECTION -- it imports every test
        # module before markers are consulted, so a module-level `import ijson`
        # kills the whole run even when that test would have been skipped.
        # Three separate PRs hit this before the cause was fixed here.
        run: |
          found=0
          for req in packages/*/requirements.txt services/*/requirements.txt; do
            [ -f "$req" ] || continue
            echo "installing $req"
            pip install -r "$req"
            found=$((found + 1))
          done
          echo "installed $found requirement file(s)"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        # -m "not e2e": the e2e suite needs a live staging project (PROOF WO3)
        run: pytest -m "not e2e"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block secrets and real PHI
        # This repo is PUBLIC (CLAUDE.md). Rule 0.6: synthetic data only.
        run: |
          if git grep -nEI '(BEGIN [A-Z ]*PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|sk_live_|live_[0-9a-f]{32})' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible secret committed"; exit 1
          fi
          if git grep -nEI '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible real SSN committed -- synthetic fixtures only"; exit 1
          fi
          echo "clean"
