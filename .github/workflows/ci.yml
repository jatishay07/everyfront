name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest pytest-cov

      - name: Install package and service requirements
        # Each packages/<name>/, services/<name>/ and fixtures/ may declare its
        # own deps. Without this, pytest fails at COLLECTION -- it imports every
        # test module before markers are consulted, so a module-level `import
        # ijson` kills the whole run even when that test would have been
        # skipped. Three separate PRs hit this before the cause was fixed here.
        # fixtures/requirements.txt was missing from this glob (PROOF flagged it
        # twice): reportlab lives there, so every fixture-bill test that needed
        # it was passing locally and never running here.
        run: |
          found=0
          for req in packages/*/requirements.txt services/*/requirements.txt fixtures/requirements.txt; do
            [ -f "$req" ] || continue
            echo "installing $req"
            pip install -r "$req"
            found=$((found + 1))
          done
          echo "installed $found requirement file(s)"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        # -m "not e2e": the e2e suite needs a live staging project (PROOF WO3)
        run: pytest -m "not e2e"

      # Root `testpaths` is ["tests", "packages"], so neither service's suite
      # ran here at all -- including the regression tests for defects that only
      # ever showed up in the deployed services. Three separate invocations
      # rather than one: services/agent-core/tests and services/api/tests each
      # contain a `test_store.py`, and pytest's default import mode derives a
      # module name from the basename, so collecting both in one run is an
      # "import file mismatch" error. Each service also needs its own conftest
      # to put its package root on sys.path (see those files).
      - name: Service tests (agent-core)
        run: pytest services/agent-core/tests -m "not e2e"

      - name: Service tests (api)
        run: pytest services/api/tests -m "not e2e"

      # services/intake was missed when the other two were wired in earlier
      # today -- so this service's entire suite (70 tests, including the
      # transport-level Gmail harness and the regression for an email with two
      # same-named PDFs silently losing one) ran on nobody's machine but a
      # maintainer's laptop. Same omission, same reason: root `testpaths` is
      # ["tests", "packages"].
      - name: Service tests (intake)
        run: pytest services/intake/tests -m "not e2e"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block secrets and real PHI
        # This repo is PUBLIC (CLAUDE.md). Rule 0.6: synthetic data only.
        run: |
          if git grep -nEI '(BEGIN [A-Z ]*PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|sk_live_|live_[0-9a-f]{32})' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible secret committed"; exit 1
          fi
          if git grep -nEI '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible real SSN committed -- synthetic fixtures only"; exit 1
          fi
          echo "clean"
